version: 2.1

executors:
  java-executor:
    docker:
      - image: selenium/standalone-chrome:latest
    working_directory: ~/repo

jobs:
  config:
    steps:
      - run:
          name: Instalar Herramientas
          command: |
            sudo apt-get update
            sudo apt-get install -y wget unzip openjdk-17-jdk
      - run:
          name: Dar permisos a Gradlew para ejecución
          command: |
            sudo chmod +x ./gradlew
      - run:
          name: Verificar versiones de Chrome y Driver
          command: |
            google-chrome --version
            chromedriver --version

  build:
    steps:
      - run:
          name: Dar permisos a Gradlew para ejecución
          command: |
            sudo chmod +x ./gradlew
      - run:
          name: Construir y Compilar Proyecto
          command: |
            ./gradlew clean build -x test

  test:
    steps:
      - run:
          name: Dar permisos a Gradlew para ejecución
          command: |
            sudo chmod +x ./gradlew
      - run:
          name: Ejecutar E2E Test
          command: |
            ./gradlew clean test -Dwebdriver.chrome.driver=/usr/bin/chromedriver aggregate reports --info --stacktrace
      - store_test_results:
          path: target/site/serenity
          when: always
          paths:
            - "*.xml" # Incluir solo archivos XML válidos de resultados de pruebas
      - store_artifacts:
          path: target/site/serenity
          when: always

workflows:
  version: 2
  build_and_test:
    jobs:
      - config
      - build:
          requires:
            - config
      - test:
          requires:
            - build

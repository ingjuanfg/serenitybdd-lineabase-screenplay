version: 2.1

executors:
  java-executor:
    docker:
      - image: selenium/standalone-chrome:latest
    working_directory: ~/repo

jobs:
  test:
    executor: java-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y wget unzip openjdk-17-jdk
      - run:
          name: Run tests
          command: ./gradlew clean test aggregate reports --info --stacktrace

workflows:
  version: 2
  test:
    jobs:
      - test

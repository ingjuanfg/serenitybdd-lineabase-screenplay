version: 2.1

executors:
  java-executor:
    docker:
      - image: circleci/openjdk:17.0.2-jdk
    working_directory: ~/repo

jobs:
  test:
    executor: java-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y wget
            wget https://services.gradle.org/distributions/gradle-6.8.3-bin.zip
            unzip gradle-6.8.3-bin.zip
            export PATH=$PATH:~/repo/gradle-6.8.3/bin
      - run:
          name: Run tests
          command: gradle clean test -Ddriver=edge -Denvironment=pdn aggregate reports --info --stacktrace
      - store_artifacts:
          path: build/reports/tests
          destination: test-results

workflows:
  version: 2
  test:
    jobs:
      - test
